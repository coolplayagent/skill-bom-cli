name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  stable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt,llvm-tools-preview
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --lib --bins --all-features
      - run: cargo test --locked --test config --test resolver --test sources --test protocol --test agentcenter --test transactions --test cli --test quality --all-features -- --test-threads=1
  bazel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - run: bazel mod deps --lockfile_mode=error
      - run: bazel build --lockfile_mode=error //:skill-bom //:skill-package
      - run: bazel test --lockfile_mode=error //...
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.8.6 --locked
      - run: cargo llvm-cov --locked --all-targets --all-features --fail-under-lines 90
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-09-01 --profile minimal --component miri,rust-src
      - run: cargo +nightly-2026-09-01 miri test --locked --lib domain::tests
      - name: Native unit tests under ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
          CARGO_TARGET_DIR: target/asan
        run: cargo +nightly-2026-09-01 test --locked --lib --target x86_64-unknown-linux-gnu -Zbuild-std
  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --test sources live_clawhub_smoke -- --ignored --nocapture
