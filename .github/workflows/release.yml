name: release-skill
on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-features

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build and smoke test native CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release
          mkdir -p release-binary
          if [[ "${{ runner.os }}" == Windows ]]; then
            target/release/skill-bom.exe --version
            cp target/release/skill-bom.exe release-binary/
          else
            target/release/skill-bom --version
            cp target/release/skill-bom release-binary/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: skill-bom-${{ runner.os }}-${{ runner.arch }}
          path: release-binary/
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: skill-bom-*
          path: release-artifacts
      - name: Validate version and package one Skill archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          grep -Fqx "version = \"${version}\"" skills/skill-bom-cli/skill.toml
          grep -Fqx "  version: \"${version}\"" skills/skill-bom-cli/SKILL.md
          args=()
          count=0
          for artifact in release-artifacts/skill-bom-*; do
            key="${artifact##*/skill-bom-}"
            os="${key%-*}"
            arch="${key##*-}"
            binary=skill-bom
            if [[ "$os" == Windows ]]; then binary=skill-bom.exe; fi
            args+=("$os" "$arch" "$artifact/$binary")
            count=$((count + 1))
          done
          test "$count" -eq 3
          archive="dist/skill-bom-cli-skill-${GITHUB_REF_NAME}.tar.gz"
          bash scripts/package-skill.sh "$archive" skills/skill-bom-cli "${args[@]}"
          for artifact in release-artifacts/skill-bom-*; do
            key="${artifact##*/skill-bom-}"
            os="${key%-*}"
            arch="${key##*-}"
            binary=skill-bom
            if [[ "$os" == Windows ]]; then binary=skill-bom.exe; fi
            tar -tzf "$archive" | grep -Fx "skill-bom-cli/assets/$os/$arch/$binary" >/dev/null
          done
          (cd dist && sha256sum "$(basename "$archive")" > SHA256SUMS)
      - name: Publish Skill release unit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/skill-bom-cli-skill-${GITHUB_REF_NAME}.tar.gz" dist/SHA256SUMS --verify-tag --title "Skill BOM CLI ${GITHUB_REF_NAME}" --generate-notes
