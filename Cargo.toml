[package]
name = "skill-bom"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Reproducible Skill dependency installation and bills of materials"
license = "MIT"
repository = "https://github.com/coolplayagent/skill-bom-cli"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
toml = "0.8"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
httpdate = "1"
icu_collator = "2"
icu_locale = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"
fs2 = "0.4"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ctrlc = "3"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
jsonschema = { version = "0.18", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
